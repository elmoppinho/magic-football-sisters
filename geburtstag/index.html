# Fragenkatalog – Happy Birthday Toni

Fußball-Quiz in drei Schwierigkeitsstufen. Diese Datei kann direkt auf GitHub gelesen und bearbeitet werden.

* **Welt 1 – Bundesliga** (leichter): Vereine, Stadien, Rekorde, Regeln
* **Welt 2 – Tour de France** (mittel): Geschichte, Trikots, Rekorde, Berge, Deutsche, Frauen
* **Welt 3 – Weltmeisterschaft** (schwerer): Geschichte, Finals, Rekorde, Frauen-WM

## So ist eine Frage aufgebaut

```
### Kategorie
Fragetext?

- [ ] falsche Antwort
- [x] richtige Antwort
- [ ] falsche Antwort
- [ ] falsche Antwort

> Kurze Erklärung, die nach dem Antworten erscheint.
```

* Fragen stehen unter **„## Welt 1“**, **„## Welt 2“** oder **„## Welt 3“**.
* Pro Welt dürfen beliebig viele Fragen stehen. Bei jedem Start einer Welt – also auch nach jedem Game Over –
  wählt das Spiel 15 neue Fragen aus, bevorzugt solche, die noch nicht gestellt wurden.
* Die Reihenfolge der Antworten wird im Spiel jedes Mal gemischt.
* Stand der Fakten: Sommer 2025 (Ergebnisse späterer Saisons sind bewusst nicht enthalten).

## Welt 1 – Bundesliga

### Grundwissen
In welchem Jahr startete die Fußball-Bundesliga?

- [ ] 1958
- [x] 1963
- [ ] 1974
- [ ] 1949

   # Boden  = Block  B Ziegel  M Σ-Kiste  [ ] { } Rohr  P Brücke  C Wolke  D Fall-Plattform  ^ Stacheln  L Lava  w Wasser */
function builder(w,cfg={}){const m=Array.from({length:ROWS},()=>Array(w).fill(' '));
  const o={m,w,plats:[],firebars:[],crushers:[],ents:[],check:null,gateX:null,arena:null,start:{c:10,r:GR-1},
    set(x,y,c){if(x>=0&&x<w&&y>=0&&y<ROWS)m[y][x]=c},get(x,y){return(x>=0&&x<w&&y>=0&&y<ROWS)?m[y][x]:' '},
    ground(a,b,top=GR,c='#'){for(let x=a;x<=b;x++)for(let y=top;y<ROWS;y++)o.set(x,y,c)},
    hole(a,b){for(let x=a;x<=b;x++)for(let y=GR-1;y<ROWS;y++)o.set(x,y,' ')},
    hill(a,b,h,c='#'){o.ground(a,b,GR-h,c)},
    ceil(a,b,bot,c='#'){for(let x=a;x<=b;x++)for(let y=0;y<=bot;y++)o.set(x,y,c)},
    rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)o.set(x,y,c)},
    row(x,y,s){[...s].forEach((c,i)=>{if(c!=='.')o.set(x+i,y,c)})},
    pipe(x,h,base=GR){const t=base-h;o.set(x,t,'[');o.set(x+1,t,']');for(let y=t+1;y<base;y++){o.set(x,y,'{');o.set(x+1,y,'}')}},
    stairs(x,n,dir=1,base=GR,c='='){for(let i=0;i<n;i++){const hh=dir>0?i+1:n-i;for(let k=1;k<=hh;k++)o.set(x+i,base-k,c)}},
    box(c,r){o.set(c,r,'M')},
    lava(a,b){for(let x=a;x<=b;x++){for(let y=GR;y<ROWS;y++)o.set(x,y,' ');for(let y=GR+1;y<ROWS;y++)o.set(x,y,'L')}},
    water(a,b){for(let x=a;x<=b;x++){for(let y=GR;y<ROWS;y++)o.set(x,y,' ');for(let y=GR+1;y<ROWS;y++)o.set(x,y,'w')}},
    e(c,r,t){o.ents.push({t,c,r})},
    lift(c,r,axis,a,b,sp=.5){o.plats.push({x:c*8,y:r*8,w:24,axis,a:a*8,b:b*8,sp,dir:1,dx:0,dy:0})},
    donut(c,r,n=1){for(let i=0;i<n;i++)o.set(c+i,r,'D')},
    spikes(a,b,r=GR-1){for(let x=a;x<=b;x++)o.set(x,r,'^')},
    firebar(c,r,len=4,sp=.035){o.set(c,r,'=');o.firebars.push({c,r,len,sp})},
    crusher(c,r){o.crushers.push({c,r})},
    check(c){o.check=c},gate(c){o.gateX=c*8},st(c,r){o.start={c,r}},
    arena(c,width,boss){o.arena={l:c,r:c+width,boss};o.ground(c-2,w-1);for(let y=0;y<GR;y++)o.set(c+width,y,'=');o.rect(c+width+1,0,w-1,ROWS-1,'=')}};
  return o}

/* ---------------- Kachelzugriff & Physik ---------------- */
function tile(c,r){if(c<0||c>=CUR.w)return'=';if(r<0||r>=ROWS)return' ';return CUR.tiles[r][c]}
function solid(c,r){return SOLID.has(tile(c,r))}
function colSolid(c,y,h){for(let r=fl(y/8);r<=fl((y+h-.01)/8);r++)if(solid(c,r))return true;return false}
function rowSolid(r,x,w){for(let c=fl(x/8);c<=fl((x+w-.01)/8);c++)if(solid(c,r))return true;return false}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function phys(o,grav=.25){let hit=false;o.x+=o.vx;
  if(o.vx>0){const c=fl((o.x+o.w-.01)/8);if(colSolid(c,o.y,o.h)){o.x=c*8-o.w;hit=true}}else if(o.vx<0){const c=fl(o.x/8);if(colSolid(c,o.y,o.h)){o.x=(c+1)*8;hit=true}}
  o.vy=Math.min(o.vy+grav,4);o.y+=o.vy;o.on=false;
  if(o.vy>0){const r=fl((o.y+o.h)/8);if(rowSolid(r,o.x,o.w)){o.y=r*8-o.h;o.vy=0;o.on=true}}else if(o.vy<0){const r=fl(o.y/8);if(rowSolid(r,o.x,o.w)){o.y=(r+1)*8;o.vy=0}}
  return hit}

function rescue(){const s=L.safe;if(!s){die();return}if(P.power>0)setPower(P.power-1);P.x=s.x;P.y=s.y+s.h-P.h-1;P.vx=0;P.vy=0;P.fly=0;P.ride=null;P.inv=150;
  L.cam=Math.max(0,Math.min(CUR.w*8-VW,P.x-VW*.38));SFX.hurt();burst(P.x+4,P.y+P.h/2,14,['#ffffff','#8ee4ff']);msg('HOPPLA! WEITER GEHT’S',90,'#8ee4ff')}
function hurt(){if(P.inv||P.freeze||state!=='play')return;if(P.power>0){setPower(P.power===2?1:0);P.inv=120;P.freeze=36;P.frz='shrink';SFX.hurt()}else die()}
function die(){if(state!=='play')return;state='dying';T=0;P.vx=0;P.vy=0;P.fly=0;jingle('death')}
function updatePlayer(){const p=P,emmyFly=p.power===2&&G.hero===1,fire=p.power===2&&G.hero===0;
  if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy}
  if(held.down&&p.on&&!p.duck)setDuck(true);else if(!held.down&&p.duck)setDuck(false);
  const dir=(p.duck&&p.on)?0:(held.right?1:0)-(held.left?1:0),runMax=G.hero===0?1.9:1.7,max=held.b?runMax:1.0*(G.hero===0?1.12:1);
  if(dir){p.face=dir;const acc=p.on?(Math.sign(p.vx)===-dir?.13:.06):.05;if(Math.abs(p.vx)>max&&Math.sign(p.vx)===dir)p.vx=dir*Math.max(max,Math.abs(p.vx)-.05);else{p.vx+=dir*acc;if(p.vx*dir>max)p.vx=dir*max}}
  else{const fr=p.on?.07:.01;p.vx=Math.abs(p.vx)<=fr?0:p.vx-Math.sign(p.vx)*fr}
  if(p.on){if(held.b&&Math.abs(p.vx)>=runMax*.9)p.pm=Math.min(60,p.pm+1.6);else p.pm=Math.max(0,p.pm-1)}else if(!p.fly)p.pm=Math.max(0,p.pm-.4);
  if(p.on)p.coyote=5;else if(p.coyote>0)p.coyote--;if(jumpTap())p.buf=5;else if(p.buf>0)p.buf--;
  if(p.buf&&p.coyote){p.vy=-(3.4+Math.abs(p.vx)*.24+(G.hero===1?.35:0));p.on=false;p.coyote=0;p.buf=0;p.ride=null;SFX.jump();if(emmyFly&&p.pm>=60){p.fly=220;SFX.flap()}}
  let grav=p.vy<0?(jumpHeld()?.16:.42):.3;p.vy=Math.min(p.vy+grav,3.8);
  if(emmyFly&&!p.on){if(p.fly>0){p.fly--;p.pm=Math.max(0,60*p.fly/220);if(jumpHeld()){p.vy=Math.max(p.vy-.5,-2.1);if(tick%10===0)SFX.flap()}}else if(jumpHeld()&&p.vy>.8){p.vy=.8;if(tick%14===0)SFX.flap()}}
  if(tap.b&&fire&&L.balls.length<2){L.balls.push({x:p.x+(p.face>0?p.w:-4),y:p.y+5,w:4,h:4,vx:2.1*p.face,vy:2,t:0});SFX.fire()}
  p.x+=p.vx;
  if(p.vx>0){const c=fl((p.x+p.w-.01)/8);if(colSolid(c,p.y,p.h)){p.x=c*8-p.w;p.vx=0}}else if(p.vx<0){const c=fl(p.x/8);if(colSolid(c,p.y,p.h)){p.x=(c+1)*8;p.vx=0}}
  if(p.x<L.cam){p.x=L.cam;if(p.vx<0)p.vx=0}const rmax=Math.min(CUR.w*8,L.cam+VW)-p.w;if(p.x>rmax){p.x=rmax;if(p.vx>0)p.vx=0}
  const oldBottom=p.y+p.h-(p.ride?p.ride.dy:0);p.y+=p.vy;p.on=false;p.ride=null;if(p.y<-24)p.y=-24;
  if(p.vy>0){const r=fl((p.y+p.h)/8);if(rowSolid(r,p.x,p.w)){p.y=r*8-p.h;p.vy=0;p.on=true}}
  else if(p.vy<0){const r=fl(p.y/8),c0=fl(p.x/8),c1=fl((p.x+p.w-.01)/8);if(solid(c0,r)||solid(c1,r)){p.y=(r+1)*8;p.vy=.5;const mid=fl((p.x+p.w/2)/8);hitBlock(solid(mid,r)?mid:(solid(c0,r)?c0:c1),r)}}
  for(const pl of CUR.plats){if(p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&oldBottom<=pl.y+1.5&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.on=true;p.ride=pl}}
  if(p.on){p.chain=0;p.fly=0;if(!p.ride){const fr=fl((p.y+p.h)/8),mc=fl((p.x+p.w/2)/8),tt=tile(mc,fr);if(tt!=='D'&&tt!==' '&&solid(fl(p.x/8),fr)&&solid(fl((p.x+p.w-1)/8),fr))L.safe={x:p.x,y:p.y,h:p.h}}}p.anim+=p.on?Math.abs(p.vx)*.18:0;if(p.inv>0)p.inv--;
  if(p.on){const fr=fl((p.y+p.h)/8);for(const c of [fl(p.x/8),fl((p.x+p.w-1)/8)])if(tile(c,fr)==='D'){const k=c+','+fr;L.donuts[k]=(L.donuts[k]||0)+1;if(L.donuts[k]>32){CUR.tiles[fr][c]=' ';delete L.donuts[k];L.falling.push({c,r:fr,y:fr*8,vy:0,t:0})}}}
  const cx=p.x+p.w/2;for(let r=fl(p.y/8);r<=fl((p.y+p.h-1)/8);r++)for(let c=fl(p.x/8);c<=fl((p.x+p.w-1)/8);c++){const t=tile(c,r);
    if(t==='L'||t==='w'){burst(cx,p.y+p.h,12,t==='L'?['#ff6a2a','#ffd040']:['#8cd0ff','#fff']);rescue();return}
    if(t==='^'&&p.y+p.h>r*8+8)hurt()}
  if(p.y>MAPH+8){rescue();return}
  if(CUR.check&&!G.run.ls[G.lvl].check&&p.x>CUR.check*8){G.run.ls[G.lvl].check=true;SFX.check();msg('HALBZEIT!',90,'#7cf0a0');if(P.power===0){setPower(1);P.freeze=20;P.frz='grow'}}}

function updateEnemies(){const pbox={x:P.x+1,y:P.y+1,w:P.w-2,h:P.h-1},wc=G.world;
  for(const e of CUR.enemies){
    if(e.dead){e.vy+=.2;e.y+=e.vy;e.x+=e.vx;if(e.y>MAPH+40)e.gone=true;continue}
    e.active=e.x>L.cam-32&&e.x<L.cam+VW+8;if(!e.active)continue;if(e.flat){if(--e.flat<=0)e.gone=true;continue}
    e.t=(e.t||0)+1;
    if(e.type==='bat'){e.x+=e.vx;e.y=e.by+Math.sin(e.t*.06)*10}
    else if(e.bomb!==undefined){e.vx=0;phys(e);if(--e.bomb<=0){explode(e);continue}}
    else{if(phys(e))e.vx=-e.vx;if(e.on){const ahead=e.vx>0?fl((e.x+e.w+1)/8):fl((e.x-1)/8);if(e.type==='beetle'&&!solid(ahead,fl((e.y+e.h+2)/8)))e.vx=-e.vx}
      const tt=tile(fl((e.x+e.w/2)/8),fl((e.y+e.h)/8));if(tt==='L'||tt==='w'){e.gone=true;continue}}
    if(e.y>MAPH+10){e.gone=true;continue}
    if(state==='play'&&overlap(pbox,e)&&e.bomb===undefined){const stomp=P.vy>.3&&(P.y+P.h-P.vy)<=e.y+4;
      if(stomp){P.vy=jumpHeld()?-4.2:-2.8;P.chain++;const pts=[100,200,400,800,1000][Math.min(P.chain-1,4)];
        if(e.type==='slime'){e.flat=30;score(pts,e.x,e.y-6);SFX.stomp()}else if(e.type==='beetle'){e.bomb=110;score(pts,e.x,e.y-6);SFX.stomp()}else killFlip(e,pts)}
      else hurt()}}
  CUR.enemies=CUR.enemies.filter(e=>!e.gone)}
function explode(e){e.gone=true;SFX.boom();const cx=e.x+6,cy=e.y+5;burst(cx,cy,26,['#ffd23a','#ff6a2a','#fff'],2.2);
  if(Math.hypot(P.x+4-cx,P.y+P.h/2-cy)<18)hurt();for(const o of CUR.enemies)if(o!==e&&!o.dead&&Math.hypot(o.x+5-cx,o.y+4-cy)<20)killFlip(o,200)}
function updateHazards(){const pb={x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-3};
  for(const h of CUR.hz){
    if(h.type==='fish'){if(h.vy===0&&h.y>MAPH){if(Math.abs(h.home-L.cam-VW/2)<VW&&--h.wait<=0){h.x=h.home;h.y=(GR+1)*8;h.vy=-4.8;h.vx=-.5}continue}
      h.vy+=.12;h.x+=h.vx;h.y+=h.vy;if(h.y>(GR+2)*8&&h.vy>0){h.y=MAPH+20;h.vy=0;h.wait=110+fl(Math.random()*60)}
      if(!h.dead&&overlap(pb,h)){if(P.vy>.3&&P.y+P.h-P.vy<=h.y+4){P.vy=-3;h.y=MAPH+20;h.vy=0;h.wait=200;score(200,h.x,h.y);SFX.stomp()}else hurt()}}
    else if(h.type==='lava'){if(h.vy===0&&h.y>MAPH){if(--h.wait<=0){h.y=h.surf;h.vy=-4.6}continue}h.vy+=.13;h.y+=h.vy;if(h.y>h.surf+4&&h.vy>0){h.y=MAPH+20;h.vy=0;h.wait=90+fl(Math.random()*50)}if(overlap(pb,h))hurt()}
    else if(h.type==='bar'){h.a+=h.sp;for(let i=1;i<=h.len;i++){const ox=h.cx+Math.cos(h.a)*i*6-2.5,oy=h.cy+Math.sin(h.a)*i*6-2.5;if(overlap(pb,{x:ox,y:oy,w:5,h:5}))hurt()}}
    else if(h.type==='crush'){
      if(h.st==='idle'){const pc=P.x+P.w/2;if(pc>h.x-8&&pc<h.x+24&&P.y>h.y)h.st='fall'}
      else if(h.st==='fall'){h.vy=Math.min(h.vy+.25,3.2);h.y+=h.vy;const r=fl((h.y+h.h)/8);if(rowSolid(r,h.x,h.w)){h.y=r*8-h.h;h.vy=0;h.st='wait';h.t=80;L.shake=8;SFX.thud();burst(h.x+8,h.y+h.h,8,['#c8d0e0','#fff'])}}
      else if(h.st==='wait'){if(--h.t<=0)h.st='rise'}else if(h.st==='rise'){h.y-=.6;if(h.y<=h.y0){h.y=h.y0;h.st='idle'}}
      if(overlap(pb,h))hurt()}}
  for(const f of L.falling){f.vy=Math.min(f.vy+.15,3);f.y+=f.vy;f.t++;if(f.t>300){if(tile(f.c,f.r)===' '&&!overlap(P,{x:f.c*8,y:f.r*8,w:8,h:8}))CUR.tiles[f.r][f.c]='D';f.done=true}}
  L.falling=L.falling.filter(f=>!f.done)}
function updateItems(){for(const it of CUR.items){
    if(it.type==='pop'){it.y+=it.vy;it.vy+=.25;if(--it.t<=0)it.gone=true;continue}
    if(it.type==='star'){if(overlap(it,P)){it.gone=true;L.stars++;score(500);SFX.star();burst(it.x+4,it.y+4,6,['#ffd23a','#fff'])}continue}
    if(it.emerge>0){it.y-=.5;it.emerge--;if(!it.emerge&&it.type==='potion')it.vx=.6;continue}
    if(it.type==='frog'){it.hop--;it.life=(it.life||0)+1;const dx=(P.x+4)-(it.x+5),dy=(P.y+P.h/2)-(it.y+4);
      if(!it.wild&&it.life>300){const dd=Math.hypot(dx,dy)||1;it.x+=dx/dd*2.5;it.y+=dy/dd*2.5;it.face=Math.sign(dx)||1;if(dd<6){it.gone=true;addLife(it.x,it.y);burst(it.x+5,it.y+4,12,['#5cf06a','#fff'])}continue}
      if(it.on&&it.hop<=0){const sg=it.wild?(Math.random()<.5?-1:1):(Math.sign(dx)||1);it.vx=sg*(it.wild?.6:Math.max(.8,Math.min(1.5,Math.abs(dx)*.04)));it.vy=it.wild?-2.4:-3;it.hop=it.wild?50:24;it.face=sg}
      phys(it,.2);if(it.on)it.vx*=.8;if(it.y>MAPH){it.gone=true;addLife(P.x,P.y);continue}
      if(overlap(it,P)){it.gone=true;addLife(it.x,it.y);burst(it.x+5,it.y+4,12,['#5cf06a','#fff'])}continue}
    if(it.type==='potion'){if(phys(it))it.vx=-it.vx;if(it.y>MAPH)it.gone=true}
    if(overlap(it,P)&&state==='play'){it.gone=true;score(1000,it.x,it.y-6);
      if(it.type==='potion'){if(P.power===0){setPower(1);P.freeze=40;P.frz='grow'}SFX.power()}
      else{const was=P.power;setPower(2);P.freeze=was===0?40:24;P.frz='grow';SFX.power();msg(G.hero===0?'GOLDENER SCHUH: LANCE SCHIESST MIT B!':'GOLDENER SCHUH: JOSEBA FLIEGT (RENNEN + SPRINGEN)!',150,'#8ee4ff')}}}
  CUR.items=CUR.items.filter(i=>!i.gone)}
function updateBalls(){for(const b of L.balls){b.t++;
    b.x+=b.vx;if(solid(fl((b.x+2)/8),fl((b.y+2)/8))){b.x-=b.vx;b.vx=-b.vx}b.y+=b.vy;if(solid(fl((b.x+2)/8),fl((b.y+2)/8))){b.y-=b.vy;b.vy=-b.vy}
    for(const e of CUR.enemies)if(e.active&&!e.dead&&!e.flat&&overlap(b,e)){killFlip(e,200);delete e.bomb;b.gone=true;break}
    for(const h of CUR.hz)if(h.type==='fish'&&h.y<MAPH&&overlap(b,h)){h.y=MAPH+20;h.vy=0;h.wait=200;b.gone=true;score(200,h.x,h.y)}
    const d=L.boss;if(d&&L.arena&&!d.dying&&!b.gone&&overlap(b,d)){b.gone=true;burst(b.x,b.y,6);if(!d.inv&&!d.rolling)hitBoss()}
    if(b.x<L.cam-8||b.x>L.cam+VW+8||b.y>MAPH||b.t>420)b.gone=true}
  L.balls=L.balls.filter(b=>!b.gone)}
function updatePlats(){for(const p of CUR.plats){const ox=p.x,oy=p.y;if(p.axis==='x'){p.x+=p.sp*p.dir;if(p.x>p.b||p.x<p.a)p.dir*=-1}else{p.y+=p.sp*p.dir;if(p.y>p.b||p.y<p.a)p.dir*=-1}p.dx=p.x-ox;p.dy=p.y-oy}}

function updateBoss(){const d=L.boss,a=CUR.arena;if(!a)return;
  if(!L.arena){if(P.x>(a.l+2)*8){L.arena=true;for(let y=0;y<GR;y++)if(CUR.tiles[y][a.l]===' ')CUR.tiles[y][a.l]='=';spawnBoss();MUS.name=null;playSong('king');msg(BOSSDEF[a.boss].name+'!',120,'#ff8a7a')}else return}

function shPower(){const s=SH.s;for(let k=0;k<6;k++){const i=(SH.next+k)%6,n=POWERS[i];const max={SPEED:3,RAKETE:1,DOPPEL:1,LASER:1,OPTION:2,SCHILD:1}[n];
    const cur={SPEED:s.spd,RAKETE:s.mis,DOPPEL:s.dbl,LASER:s.las,OPTION:s.opt,SCHILD:s.shield>0?1:0}[n];if(cur<max){SH.next=(i+1)%6;
      if(n==='SPEED')s.spd++;if(n==='RAKETE')s.mis=1;if(n==='DOPPEL'){s.dbl=1;s.las=0}if(n==='LASER'){s.las=1;s.dbl=0}if(n==='OPTION')s.opt++;if(n==='SCHILD')s.shield=4;
      SH.fx.push({txt:n+'!',t:90});SFX.power();return}}SH.score+=5000;SH.fx.push({txt:'+5000',t:90})}
function shAsk(){const q=SH.qs[SH.qi++];if(!q){shPower();return}SH.asked++;G.world=SH.lvl;
  ask('POWER-UP '+SH.qi+'/'+SH.qs.length+' · '+SHNAMES[SH.lvl],ok=>{if(ok){SH.correct++;shPower()}else SH.fx.push({txt:'KEIN POWER-UP',t:90})},false,q)}
function shSpawn(){const t=SH.t,L=SH.lvl,E2=SH.e,top=40,bot=DH-24;
  if(t%420===200&&SH.capN<SH.qs.length){SH.capN++;E2.push({k:'cap',x:DW+20,y:top+40+Math.random()*(bot-top-80),hp:1,t:0,y0:0,w:20,h:14})}
  if(t%90===0){const pat=(fl(t/90)+L)%5,yy=top+30+Math.random()*(bot-top-60);
    if(pat===0)for(let i=0;i<5;i++)E2.push({k:'bird',x:DW+20+i*26,y:yy,y0:yy,hp:1,t:-i*8,w:18,h:14,pat:'sine'});
    if(pat===1)for(let i=0;i<3;i++)E2.push({k:'duck',x:DW+20+i*40,y:top+10,hp:1,t:0,w:20,h:16,pat:'dive'});
    if(pat===2)E2.push({k:'can',x:DW+20,y:bot-20,hp:3,t:0,w:20,h:20,pat:'ground'});
    if(pat===3)for(let i=0;i<4;i++)E2.push({k:L===1?'cup':'sock',x:DW+20+i*30,y:yy+(i%2?20:-20),y0:yy+(i%2?20:-20),hp:1,t:i*10,w:16,h:20,pat:'sine'});
    if(pat===4&&t>600)E2.push({k:'ufo',x:DW+30,y:yy,y0:yy,hp:6+L*2,t:0,w:36,h:20,pat:'ufo'})}}
function shHit(){const s=SH.s;if(s.inv>0||SH.phase!=='play'&&SH.phase!=='boss')return;if(s.shield>0){s.shield--;s.inv=40;SFX.bump();return}
  SFX.boom();for(let i=0;i<16;i++)SH.fx.push({x:s.x,y:s.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,t:40,c:'#ffe060'});SH.phase='dead';SH.T=0;stopSong();jingle('death')}
function shStep(){SH.T++;tick++;if(quizOpen)return;const s=SH.s;
  if(SH.paused){if(tap.start){SH.paused=false;duck(false)}if(tap.b||tap.back){SH.paused=false;duck(false);backToWorlds()}return}
  if(SH.phase==='intro'){if(SH.T>120||(SH.T>30&&(tap.a||tap.start))){SH.phase='play';SH.T=0;MUS.name=null;playSong('shmup')}return}
  if(SH.phase==='dead'){if(SH.T>110){SH.lives--;if(SH.lives<0){SH.phase='over';SH.T=0;jingle('over')}else{const keepBoss=SH.boss;shReset();SH.boss=keepBoss;SH.e=[];SH.phase=keepBoss?'boss':'play';MUS.name=null;playSong(keepBoss?'shboss':'shmup')}}return}
  if(SH.phase==='over'){if(SH.T>200||(SH.T>60&&(tap.a||tap.start)))backToWorlds();return}
  if(SH.phase==='clear'){if(SH.T>220||(SH.T>90&&(tap.a||tap.start))){if(SH.lvl<2){SH.lvl++;shLevel()}else{SH.phase='end';SH.T=0;UNL.fin=1;saveUnl();jingle('win')}}return}
  if(SH.phase==='end'){if(SH.T>150&&(tap.a||tap.start))backToWorlds();return}
  if(tap.start){SH.paused=true;duck(true);SFX.pause();return}
  SH.t++;SH.scroll+=1.2;
  const sp=2.2+s.spd*.8,ax=(held.right?1:0)-(held.left?1:0),ay=(held.down?1:0)-(held.up?1:0);s.x=Math.max(20,Math.min(DW-30,s.x+ax*sp));s.y=Math.max(40,Math.min(DH-18,s.y+ay*sp));if(s.inv>0)s.inv--;
  SH.hist.unshift([s.x,s.y]);if(SH.hist.length>40)SH.hist.pop();
  const shooters=[[s.x,s.y]];for(let i=0;i<s.opt;i++){const h=SH.hist[Math.min(SH.hist.length-1,(i+1)*14)];if(h)shooters.push(h)}
  if((tap.b||(held.b&&SH.T%10===0))&&SH.b.filter(b=>b.k!=='m').length<8*(1+s.opt)){for(const [x,y] of shooters){
      if(s.las)SH.b.push({k:'l',x:x+14,y,vx:9,vy:0,w:40,h:4,pierce:1});else SH.b.push({k:'s',x:x+14,y,vx:8,vy:0,w:12,h:6});
      if(s.dbl)SH.b.push({k:'s',x:x+10,y:y-4,vx:6,vy:-6,w:10,h:6})}SFX.fire()}
  if(s.mis&&SH.T%30===0)for(const [x,y] of shooters)SH.b.push({k:'m',x:x,y:y+6,vx:3,vy:3.5,w:8,h:8});
  for(const b of SH.b){b.x+=b.vx;b.y+=b.vy;if(b.k==='m'&&b.y>DH-20){b.y=DH-20;b.vy=0;b.vx=5}if(b.x>DW+40||b.y<20||b.y>DH)b.dead=true}
  if(!SH.boss){shSpawn();if(SH.t>3300&&!SH.e.length){SH.boss={k:SH.lvl,x:DW+60,y:DH/2,hp:0,max:60+SH.lvl*25,t:0,inv:0,enter:true};SH.phase='boss';MUS.name=null;playSong('shboss')}}
  for(const e of SH.e){e.t++;
    if(e.k==='cap'){e.x-=1.6;e.y+=Math.sin(e.t/14)*1.2}
    else if(e.pat==='sine'){e.x-=2.4;e.y=e.y0+Math.sin((e.t)/12)*26}
    else if(e.pat==='dive'){e.x-=2.2;if(e.t>30)e.y+=Math.sign(s.y-e.y)*1.8}
    else if(e.pat==='ground'){e.x-=1.2;if(e.t%70===35){const dx=s.x-e.x,dy=s.y-e.y,d=Math.hypot(dx,dy)||1;SH.eb.push({x:e.x,y:e.y-10,vx:dx/d*2.4,vy:dy/d*2.4})}}
    else if(e.pat==='ufo'){e.x-=e.x>DW*.7?1.6:.4;e.y=e.y0+Math.sin(e.t/30)*40;if(e.t%60===30)for(const a of [-.4,0,.4])SH.eb.push({x:e.x-10,y:e.y,vx:-Math.cos(a)*2.6,vy:Math.sin(a)*2.6});if(e.t>600)e.x-=3}
    if(e.x<-60)e.dead=true;
    for(const b of SH.b)if(!b.dead&&!e.dead&&Math.abs(b.x-e.x)<(b.w+e.w)/2&&Math.abs(b.y-e.y)<(b.h+e.h)/2){if(!b.pierce)b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;SH.score+=e.k==='ufo'?1000:100;SFX.stomp();
        SH.fx.push({x:e.x,y:e.y,boom:1,t:18});if(e.k==='cap')shAsk()}}
    if(!e.dead&&e.k!=='cap'&&Math.abs(s.x-e.x)<(e.w+12)/2&&Math.abs(s.y-e.y)<(e.h+8)/2)shHit()}
  SH.e=SH.e.filter(e=>!e.dead);
  const B=SH.boss;if(B){B.t++;if(B.inv>0)B.inv--;
    if(B.enter){B.x-=1.5;if(B.hp<B.max&&B.t%2===0)B.hp+=2;if(B.x<DW-100){B.enter=false;B.hp=B.max;B.t=0}}
    else if(B.hp>0){B.y=DH/2+Math.sin(B.t/50)*(DH/2-80);const per=[50,40,34][B.k];
      if(B.t%per===0){const dx=s.x-B.x,dy=s.y-B.y,d=Math.hypot(dx,dy)||1;const n=B.k===2?5:3;for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.22,c=Math.cos(a),si=Math.sin(a);SH.eb.push({x:B.x-30,y:B.y,vx:(dx/d*c-dy/d*si)*2.8,vy:(dx/d*si+dy/d*c)*2.8})}SFX.fire()}
      if(B.k>0&&B.t%200===100)for(let i=0;i<12;i++){const a=i*Math.PI/6;SH.eb.push({x:B.x,y:B.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2})}
      for(const b of SH.b)if(!b.dead&&Math.abs(b.x-B.x)<44&&Math.abs(b.y-B.y)<44){if(!b.pierce)b.dead=true;if(B.inv<=0){B.hp-=b.k==='l'?1:1;B.inv=b.k==='l'?6:2;SFX.bump()}}
      if(Math.abs(s.x-B.x)<40&&Math.abs(s.y-B.y)<40)shHit();
      if(B.hp<=0){B.hp=0;SH.phase='clear';SH.T=0;stopSong();SFX.boom();jingle('clear');SH.score+=10000;for(let i=0;i<30;i++)SH.fx.push({x:B.x+(Math.random()-.5)*90,y:B.y+(Math.random()-.5)*90,boom:1,t:20+fl(Math.random()*50)});SH.eb=[]}}}
  for(const b of SH.eb){b.x+=b.vx;b.y+=b.vy;if(Math.abs(b.x-s.x)<7&&Math.abs(b.y-s.y)<6){b.dead=true;shHit()}if(b.x<-20||b.x>DW+20||b.y<0||b.y>DH+10)b.dead=true}
  SH.eb=SH.eb.filter(b=>!b.dead);SH.b=SH.b.filter(b=>!b.dead);
  for(const f of SH.fx){f.t--;if(f.vx!==undefined){f.x+=f.vx;f.y+=f.vy}}SH.fx=SH.fx.filter(f=>f.t>0)}
const SHBG={};
function shBack(l){if(SHBG[l])return SHBG[l];let seed=l*131+7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const far=layer(640,288,(x,w,h)=>{if(l===0){for(let i=0;i<10;i++)E(x,rnd()*w,30+rnd()*150,30+rnd()*30,10+rnd()*8,'#ffffffcc')}
    else{for(let i=0;i<140;i++)R(x,rnd()*w,rnd()*h,i%9?1:2,i%9?1:2,'#ffffff');if(l===1)E(x,480,70,30,30,'#fff6c0');if(l===2){E(x,160,90,40,40,'#ff8a5a');E(x,150,80,14,10,'#ffc0a0');E(x,520,200,22,22,'#8ac8ff')}}});
  const near=layer(640,90,(x,w,h)=>{const c=['#2a6a3a','#2a1e4a','#1a1a3a'][l];
    if(l===0){for(let X=0;X<w;X+=160){PG(x,[[X,h],[X+20,h-50],[X+140,h-50],[X+160,h]],'#4a6a9a');for(let r=0;r<4;r++)for(let k=X+24;k<X+136;k+=4)R(x,k,h-44+r*10,2,2,['#e0303c','#ffffff','#ffd23a'][(k+r)%3]);R(x,X+4,h-80,3,30,'#c8c8d8');R(x,X+150,h-80,3,30,'#c8c8d8')}R(x,0,h-8,w,8,'#3aa84a')}
    else if(l===1){for(let X=0;X<w;X+=60){const bh=30+rnd()*40;R(x,X,h-bh,40,bh,c);PG(x,[[X-4,h-bh],[X+20,h-bh-20],[X+44,h-bh]],c);R(x,X+18,h-bh+8,4,6,'#ffe060')}}
    else{for(let X=0;X<w;X+=50)E(x,X+25,h,30,18+rnd()*14,c)}});
  return SHBG[l]={far:vivid(far,1.1,1.04),near:vivid(near,1.15,1.04)}}
function shRender(){const l=SH.lvl,s=SH.s,bg=shBack(l);const grad=[['#3a8ae8','#bfe4ff'],['#140a3a','#4a2a6a'],['#020210','#1a1440']][l];
  const gr=g.createLinearGradient(0,0,0,DH);gr.addColorStop(0,grad[0]);gr.addColorStop(1,grad[1]);g.fillStyle=gr;g.fillRect(0,0,DW,DH);
  for(const [img,f,y] of [[bg.far,.25,0],[bg.near,.9,DH-90]]){const w=img.width/3,ox=-(SH.scroll*f)%w;for(let x=ox-w;x<DW;x+=w)g.drawImage(img,w,0,w,img.height,x,y,w,img.height)}
  for(const e of SH.e){const img=SHE[e.k][fl((e.t>0?e.t:0)/8)%2];g.drawImage(img.r,fl(e.x-img.r.width/2),fl(e.y-img.r.height/2));if(e.k==='cap'&&SH.T%20<10){g.globalAlpha=.4;E(g,e.x,e.y,16,12,'#ffffff');g.globalAlpha=1}}
  const B=SH.boss;if(B){const im=SHBI[B.k],img=B.inv>0&&B.inv%4<2?im.h:im.a;g.drawImage(img.r,fl(B.x-48),fl(B.y-48))}
  for(const b of SH.b){if(b.k==='l'){R(g,b.x-20,b.y-2,40,4,'#8ae8ff');R(g,b.x-20,b.y-1,40,2,'#ffffff')}else g.drawImage(b.k==='m'?SHS.mis.r:SHS.shot.r,fl(b.x-6),fl(b.y-4))}
  for(const b of SH.eb)g.drawImage(SHS.eb.r,fl(b.x-5),fl(b.y-5));
  if(SH.phase!=='dead'&&SH.phase!=='over'){for(let i=0;i<s.opt;i++){const h=SH.hist[Math.min(SH.hist.length-1,(i+1)*14)];if(h)g.drawImage(SHS.opt[fl(SH.T/6)%2].r,fl(h[0]-7),fl(h[1]-7))}
    if(!(s.inv>0&&s.inv%6<3)){g.drawImage(SHIP[G.hero].r,fl(s.x-17),fl(s.y-11));if(s.shield>0){g.globalAlpha=.35+.1*Math.sin(SH.T/4);E(g,s.x+4,s.y,22,16,'#8ae8ff');g.globalAlpha=1}}}
  for(const f of SH.fx){if(f.txt){textC(f.txt,60,SH.T%8<4?'#ffe060':'#ffffff',2);continue}if(f.boom){g.globalAlpha=Math.min(1,f.t/20);E(g,f.x,f.y,14-f.t/3,14-f.t/3,'#ffe060');E(g,f.x,f.y,8-f.t/5,8-f.t/5,'#ffffff');g.globalAlpha=1}else R(g,f.x,f.y,3,3,f.c)}
  R(g,0,0,DW,26,'#0b0f2acc');text((G.hero?'JOSEBA':'LANCE')+' ♥×'+Math.max(0,SH.lives),8,4,'#ffffff');text('PUNKTE '+SH.score,8,14,'#ffe060');textC('FINALE '+(l+1)+' · '+SHNAMES[l],4,'#ffd23a');textC('FRAGEN '+SH.correct+'/'+SH.asked+' RICHTIG',14,'#c4b8ff');
  const pw=[s.spd>0,s.mis,s.dbl,s.las,s.opt>0,s.shield>0],bw=Math.min(70,(DW-20)/6);for(let i=0;i<6;i++){const x=10+i*bw,y=DH-14,on=pw[i],nx=i===SH.next;R(g,x,y,bw-4,12,OL);R(g,x+1,y+1,bw-6,10,on?'#2a8a4a':nx?'#8a6a1a':'#2a2e4a');textC(POWERS[i]+(i===0&&s.spd>1?'×'+s.spd:i===4&&s.opt>1?'×2':''),y+3,on?'#ffffff':nx?'#ffe060':'#9a9ab8',1,x+(bw-4)/2)}
  if(B&&!B.enter){R(g,DW/2-102,30,204,8,OL);R(g,DW/2-100,32,200*B.hp/B.max,4,'#ff6a6a')}
  if(SH.phase==='intro'){drawPanel(DW/2-160,90,320,92);textC('FINALE '+(l+1)+' · '+SHNAMES[l],104,'#ffd23a',2);textC('POWER-KAPSELN ABSCHIESSEN = FRAGE',128,'#ff9a9a');textC('RICHTIG = NÄCHSTE FÄHIGKEIT FÜRS RAUMSCHIFF',142,'#ffffff');textC('B: FEUER (HALTEN = DAUERFEUER) · STEUERKREUZ: FLIEGEN',158,'#c4b8ff')}
  if(SH.phase==='clear'&&SH.T>40){drawPanel(DW/2-130,100,260,60);textC(SHBOSS[l]+' BESIEGT!',114,'#7cf0a0',2);textC('LEVEL '+(l+1)+' GESCHAFFT',138,'#ffffff')}
  if(SH.phase==='over'){drawPanel(DW/2-110,100,220,60);textC('GAME OVER',114,'#ff9a8a',2);textC('DAS FINALE BLEIBT FREIGESCHALTET',138,'#ffffff')}
  if(SH.phase==='end'){drawPanel(DW/2-190,60,380,160);textC('HERZLICHEN GLÜCKWUNSCH!',76,'#ffd23a',2);textC((G.hero?'JOSEBA':'LANCE')+' IST MEISTER ALLER KLASSEN!',104,'#ffffff');
    textC('BUNDESLIGA · TOUR DE FRANCE · WELTMEISTERSCHAFT',122,'#8ac8ff');textC('ROBO-BONUS · FINALE · ALLES GESCHAFFT',138,'#7cf0a0');textC('PUNKTE: '+SH.score+' · FRAGEN RICHTIG: '+SH.correct,158,'#ffe060');if(SH.T>150&&fl(SH.T/24)%2)textC('A: ZUM MENÜ',196,'#ffffff')}
  if(SH.paused){g.fillStyle='#0008';g.fillRect(0,0,DW,DH);drawPanel(DW/2-110,100,220,64);textC('PAUSE',114,'#ffd23a',2);textC('START: WEITER · B: ZUM MENÜ',140,'#ffffff');HITS.push({x:DW/2-110,y:100,w:220,h:64,f:()=>{tap.start=true}})}}


function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}render();const pl=['play','dying','clear','mm','sh'].includes(state)?'1':'0';if(document.body.dataset.play!==pl)document.body.dataset.play=pl;requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused&&!quizOpen){paused=true;duck(true)}});
function layout(){const vv=window.visualViewport,W=vv?vv.width:innerWidth,H=vv?vv.height:innerHeight;
  const asp=W/H;DW=Math.max(320,Math.min(720,Math.round(288*asp/2)*2));VW=DW/2;if(cv.width!==DW){cv.width=DW;cv.height=DH;g=cv.getContext('2d');g.imageSmoothingEnabled=false}
  const s=Math.min(W/DW,H/DH);cv.style.width=Math.round(DW*s)+'px';cv.style.height=Math.round(DH*s)+'px'}
addEventListener('resize',layout);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
G.cat='FB';setMusic(AU.music);setSfx(AU.sfx);loadCatalogs();layout();requestAnimationFrame(loop);
